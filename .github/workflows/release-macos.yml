name: macOS release

on:
  release:
    types: [published]
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$TAG_VERSION" = "$PROJECT_VERSION"

      - name: Prepare universal Ollama and local model
        run: |
          curl -fsSL https://ollama.com/download/Ollama-darwin.zip -o "$RUNNER_TEMP/Ollama-darwin.zip"
          unzip -q "$RUNNER_TEMP/Ollama-darwin.zip" -d "$RUNNER_TEMP"
          echo "OLLAMA_APP_PATH=$RUNNER_TEMP/Ollama.app" >> "$GITHUB_ENV"
          lipo -verify_arch arm64 x86_64 "$RUNNER_TEMP/Ollama.app/Contents/Resources/ollama"
          "$RUNNER_TEMP/Ollama.app/Contents/Resources/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          "$RUNNER_TEMP/Ollama.app/Contents/Resources/ollama" pull qwen2.5:3b

      - name: Build complete installer (split only if GitHub size limit requires it)
        id: build
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          export OLLAMA_MODELS_PATH="$HOME/.ollama/models"
          BUNDLE_LOCAL_AI=1 ./packaging/build-release.sh
          PACKAGE_BYTES="$(stat -f%z "dist/Jarvis-$VERSION.pkg")"
          if [ "$PACKAGE_BYTES" -lt 2147483648 ]; then
            echo "mode=single" >> "$GITHUB_OUTPUT"
            echo "Complete offline installer size: $PACKAGE_BYTES bytes"
          else
            echo "The complete installer exceeds GitHub's 2 GiB asset limit; preparing install-on-demand and offline component packages."
            BUNDLE_LOCAL_AI=0 ./packaging/build-release.sh
            ./packaging/build-offline-components.sh
            for package in "dist/Jarvis-$VERSION.pkg" "dist/Jarvis-$VERSION-Ollama.pkg" "dist/Jarvis-$VERSION-Qwen-3b-Model.pkg"; do
              test "$(stat -f%z "$package")" -lt 2147483648
            done
            echo "mode=split" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach installer to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${{ steps.build.outputs.mode }}" = "single" ]; then
            gh release upload "$GITHUB_REF_NAME" "dist/Jarvis-$VERSION.pkg" --clobber
          else
            gh release upload "$GITHUB_REF_NAME" \
              "dist/Jarvis-$VERSION.pkg" \
              "dist/Jarvis-$VERSION-Ollama.pkg" \
              "dist/Jarvis-$VERSION-Qwen-3b-Model.pkg" \
              --clobber
          fi
